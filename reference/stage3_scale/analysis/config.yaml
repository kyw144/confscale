statistics:
  alpha: 0.05
  confidence_level: 0.95
  multiple_comparison: "bonferroni-holm"
  baselines:
    primary: "hpa-reactive"
    predictive: "hpa-predictive"
  effect_size_thresholds:
    negligible: 0.2
    small: 0.5
    medium: 0.8
    large: 1.2

metrics:
  slo:
    target_p95_ms: 100
    use_e2e: true
  normalization:
    enabled: false

tables:
  float_format: "%.3f"
  significant_digits: 3
  latex:
    column_format: "lcccccc"
    label_prefix: "tab:"
    caption_prefix: "ConfScale Results — "
  markdown: true

figures:
  dpi: 300
  format: "pdf"
  width_single_col: 3.5
  width_double_col: 7.0
  height_square: 3.5
  height_wide: 2.5
  font_family: "sans-serif"
  font_size: 9
  title_size: 11
  palette: "colorblind"
  method_colors:
    hpa-reactive: "#1f77b4"
    hpa-predictive: "#ff7f0e"
    hpa-predictive-safety: "#d62728"
    keda: "#9467bd"
    base-inspired: "#8c564b"
    confscale-be: "#e377c2"
    confscale-scp: "#2ca02c"
    confscale-qr: "#17becf"
  tier_colors:
    tier1: "#27ae60"
    tier2: "#f39c12"
    tier3: "#e74c3c"
  reference_line:
    color: "#7f7f7f"
    linestyle: "--"
    alpha: 0.7

report:
  output_dirs:
    tables: "tables"
    figures: "figures"
    statistics: "statistics"
    data: "data"
  reproducibility:
    include_requirements: true
    include_readme: true
    gen_reproduce_script: true

workloads:
  A:
    label: "Diurnal"
    description: "Stable sinusoidal pattern, 24h periodicity"
    category: "predictable"
    order: 1
  B:
    label: "Bursty"
    description: "Intermittent traffic spikes, high uncertainty"
    category: "uncertain"
    order: 2
  C:
    label: "Batch-Ramp"
    description: "Sustained load transition, step-function RPS"
    category: "transitional"
    order: 3
  D:
    label: "Signaling"
    description: "Periodic impulse train, sharp transitions"
    category: "intermittent"
    order: 4

method_order:
  - hpa-reactive
  - hpa-predictive
  - hpa-predictive-safety
  - keda
  - base-inspired
  - confscale-be
  - confscale-scp
  - confscale-qr

method_labels:
  hpa-reactive: "HPA-Reactive"
  hpa-predictive: "HPA-Predictive"
  hpa-predictive-safety: "HPA-Predictive-Safety"
  keda: "KEDA"
  base-inspired: "BASE-Inspired"
  confscale-be: "ConfScale-BE"
  confscale-scp: "ConfScale-SCP"
  confscale-qr: "ConfScale-QR"

uq_method_labels:
  be: "Bootstrap Ensemble"
  scp: "Split-Conformal Prediction"
  qr: "Quantile Regression"
