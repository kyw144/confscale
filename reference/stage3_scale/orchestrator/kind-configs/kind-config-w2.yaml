kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 31082
    protocol: TCP
  - containerPort: 30443
    hostPort: 31445
    protocol: TCP
  kubeadmConfigPatches:
  - "kind: InitConfiguration\nnodeRegistration:\n  kubeletExtraArgs:\n    node-labels:\
    \ \"ingress-ready=true\"\n"
