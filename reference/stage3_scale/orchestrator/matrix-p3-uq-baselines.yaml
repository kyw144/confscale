# P3 UQ baselines — Action 5 (risk-quantile) + online-recal validation.
#
# Two methods, both SCP-based:
#
#   risk-quantile-scp     MagicScaler-style baseline. policy=ci-upper means
#                         the scaler ignores the 3-tier policy entirely and
#                         scales to max(ci_upper). Engages explicitly with
#                         nearest prior (Pan et al., PVLDB 2023).
#
#   confscale-scp-online  Standard 3-tier SCP scaler, but with online q_hat
#                         recalibration. Each iteration matches the latest
#                         RPS observation against the corresponding past
#                         prediction's horizon, builds per-horizon residual
#                         buffers, and refreshes q_hat once each horizon
#                         has 30+ samples. Tests whether calibration drift
#                         under workload replay is fixable in-loop.
#
# Scope: both methods × all 4 workloads × 3 reps = 24 cells.
# Wall-time @ workers=3: ~8h.

methods:
  - risk-quantile-scp
  - confscale-scp-online

workloads:
  - A
  - B
  - C
  - D

replicates: 3

duration_s: 3600
complexity: 50000
cooldown_s: 60
frontend_url: http://localhost:30080
