# P3 workload-D reps 4-5 — Action 7 of the publication plan.
#
# Tightens the 68% replica-savings CI on workload D (the cleanest cost
# story in the dataset). Adds two more reps of confscale-scp + hpa-reactive
# on D only; reps 4 and 5 are labeled via start_replicate=4 so they merge
# cleanly with the existing rep 1-3 data in e1_96cell_merged_20260513_151553/.
#
# Cells: 2 methods × 1 workload × 2 reps = 4
# Wall-time @ workers=3: ~1.5h (2 cells run in parallel, 2 sequentially).

methods:
  - confscale-scp
  - hpa-reactive

workloads:
  - D

replicates: 2
start_replicate: 4

duration_s: 3600
complexity: 50000
cooldown_s: 60
frontend_url: http://localhost:30080
