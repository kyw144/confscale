[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confscale-paper-artifact"
version = "0.1.0"
description = "Local inspection and frozen-evidence regeneration for the ConfScale paper"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
planner = ["numpy>=2,<3"]

[project.scripts]
confscale = "confscale.__main__:main"

[tool.setuptools]
packages = ["confscale"]

# Evidence is intentionally repository-relative. Use an editable install for the
# complete artifact; a wheel contains the importable code only.
