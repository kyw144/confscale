<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="loop-title loop-description">
<title id="loop-title">Calibration-aware autoscaling loop</title>
<desc id="loop-description">Monitored predictive variants use traffic observations to forecast demand and check earlier intervals. Recalibration adjusts future intervals; an optional coverage-driven ladder widens intervals before replica planning. Kubernetes scales the worker and returns measurements.</desc>
